$kind: http-request
description: "Full access: can create, update and delete people."
url: "{{base_url}}/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "Admin123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('access_token', body.access);
      pm.collectionVariables.set('refresh_token', body.refresh);
      pm.collectionVariables.set('person_id', body.person_id);

      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('role is ADMIN', () => pm.expect(body.role).to.eql('ADMIN'));
    language: text/javascript
order: 1000
