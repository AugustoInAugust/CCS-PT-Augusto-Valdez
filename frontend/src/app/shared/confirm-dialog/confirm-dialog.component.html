<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4"
  (click)="onCancel()"
>
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    class="w-full max-w-md rounded-xl bg-white p-6 shadow-lg"
    (click)="$event.stopPropagation()"
  >
    <h2 id="confirm-dialog-title" class="text-lg font-semibold text-slate-900">
      {{ title() }}
    </h2>
    <p class="mt-2 text-sm text-slate-600">{{ message() }}</p>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="busy()"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 disabled:opacity-50"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        (click)="confirmed.emit()"
        [disabled]="busy()"
        class="rounded-lg px-4 py-2 text-sm font-medium text-white disabled:opacity-50 disabled:cursor-not-allowed"
        [class]="danger() ? 'bg-red-600 hover:bg-red-700' : 'bg-slate-900 hover:bg-slate-800'"
      >
        {{ busy() ? 'Working...' : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
