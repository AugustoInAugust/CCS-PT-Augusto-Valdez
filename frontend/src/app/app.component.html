@if (isAuthenticated()) {
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3 text-sm">
      <span class="font-medium text-slate-900">{{ username() }}</span>
      <span
        class="rounded-full px-2 py-0.5 text-xs font-medium"
        [class]="isAdmin() ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'"
      >
        {{ isAdmin() ? 'Admin' : 'User' }}
      </span>
      <button
        type="button"
        (click)="logout()"
        class="ml-auto text-slate-600 hover:text-slate-900 hover:underline"
      >
        Sign out
      </button>
    </div>
  </header>
}

<main class="min-h-screen bg-slate-100">
  <router-outlet />
</main>
